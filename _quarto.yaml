project:
  type: website
  output-dir: docs
  resources:
    - files/zotero-items.json
    - files/Pre-UC.json
    - files/map_of_references_card-lab_cited.html
    - files/map_of_references_citing_card-lab.html
    - files/map_of_references_citing_lab-pi.html
  pre-render:
    - scripts/pre-render-timeline-slideshow-photos.sh
    - scripts/pre-render-people-action.sh
  post-render:
    - scripts/post-render-sync-site-assets.sh
    - scripts/post-render-encrypt-private.sh
    - conda run -n card-lab python scripts/post-render-generate-sitemap.py
    - conda run -n card-lab python scripts/qc_check.py
    - conda run -n card-lab python -c "from pathlib import Path; import shutil; src=Path('scripts/qc_report.html'); dst=Path('docs/qc_report.html'); print('[post-render] qc_report.html not found; skipping copy' if not src.exists() else (dst.parent.mkdir(parents=True, exist_ok=True) or shutil.copy(src, dst) or '[post-render] copied qc_report.html'))"

execute:
  echo: false  # Hide all code by default
  warning: false # Hide all warnings
  message: false # Hide all messages
  error: false   # Hide all errors
  jupyter: card-lab
  freeze: auto

website:
  title: "Critical Alloy Research & Discovery Lab"
  favicon: files/site/3-clubs-favicon-r.png
  open-graph: true
  
  navbar:
    logo: files/brand/uc_white.png
    logo-alt: "University of Cincinnati Logo"
    logo-href: https://www.uc.edu
    search: true
    right:
      - href: index.qmd
        text: Home
      - href: people/current.qmd
        text: People
      - href: research/workproducts.qmd
        text: Work Products
      - href: capabilities/facilities.qmd
        text: Capabilities
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/paytonej/card-lab-website
          - text: Report a Bug
            href: https://github.com/paytonej/card-lab-website/issues
			
  sidebar:
    - title: "People"
      style: "docked"
      contents: 
        - href: people/current.qmd
          text: "Current Members"
        - href: people/alumni.qmd
          text: "Alumni"
        - href: people/demographics.ipynb
          text: "Demographics"
        - href: people/slideshow.qmd
          text: "Photo Slideshow"
        - href: people/timeline.ipynb
          text: "Group Timeline"
        - href: people/principal-investigator.qmd
          text: "About the PI"
      background: light
      logo: files/site/fluent--people-community-48-regular-ucred.svg
      border: true
    - title: "Research"
      style: "docked"
      contents:
        - href: research/workproducts.qmd
          text: "Work Products"
        - href: research/bibliometrics.ipynb
          text: "Bibliometrics"
        - href: research/scientometrics.ipynb
          text: "Scientometrics"
        - href: research/collaboration-network.ipynb
          text: "Collaboration Network"
      background: light
      logo: files/site/hugeicons--elearning-exchange-48-ucred.svg 
      border: true
    - title: "Capabilities"
      style: "docked"
      contents: 
        - href: capabilities/facilities.qmd
          text: "Facilities"
        - href: capabilities/mmie-research.qmd
          text: "Research @ UC MMIE"
        - href: capabilities/cincinnati.qmd
          text: "Cincinnati, OH"
        - href: capabilities/teaching.qmd
          text: "Teaching"
        - href: capabilities/service.qmd
          text: "Service"
      background: light
      logo: files/site/game-icons--materials-science.svg
      border: true
  page-footer:
    background: primary
    right: 
      - text: "© {{< meta date >}} Eric J Payton | "
      - text: Impressum | 
        href: impressum.qmd
      - text: Site Map | 
        href: site-map.qmd
 
    left: 
      - text: "{{< iconify game-icons card-jack-diamonds >}}{{< iconify game-icons card-ace-spades >}}{{< iconify game-icons card-9-diamonds >}}"
        href: easteregg.qmd
      - text: "{{< iconify academicons zotero-square >}}"
        href: https://www.zotero.org/groups/5985739/uc_card_lab/
        target: _blank
      - text: "{{< iconify uiw github >}}"
        href: https://github.com/card-lab
        target: _blank

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    email-obfuscation: javascript
    description-meta: "The Critical Alloy Research & Discovery Lab (CARD Lab) at the University of Cincinnati develops and designs metallic materials critical for future economic and energy security."
    lang: en
    date: last-modified