name: Fetch Zotero Items

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '0 16 * * 3' # Runs every Wednesday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-zotero-items:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch Zotero group library cache
        run: node scripts/fetch-zotero-items.mjs

      - name: Fetch PI personal Zotero library cache
        run: node scripts/fetch-zotero-items_pi.mjs

      - name: Detect Zotero cache changes
        id: zotero_changed
        run: |
          git add files/zotero-group-library.json files/paytonej-pre-uc.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No zotero cache changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Zotero cache changes detected."
          fi

      - name: Install Miniforge
        if: steps.zotero_changed.outputs.changed == 'true'
        run: |
          curl -L -o miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash miniforge.sh -b -p "$HOME/miniforge"
          echo "$HOME/miniforge/bin" >> "$GITHUB_PATH"

      - name: Create card-lab environment
        if: steps.zotero_changed.outputs.changed == 'true'
        run: |
          eval "$($HOME/miniforge/bin/conda shell.bash hook)"
          conda env create -f environment.yml
          conda run -n card-lab python -m ipykernel install --user --name card-lab --display-name card-lab

      - name: Set up Quarto
        if: steps.zotero_changed.outputs.changed == 'true'
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Update people publication sections
        if: steps.zotero_changed.outputs.changed == 'true'
        run: |
          eval "$($HOME/miniforge/bin/conda shell.bash hook)"
          conda run -n card-lab python scripts/update-people-publications.py

      - name: Render updated people and metrics pages
        if: steps.zotero_changed.outputs.changed == 'true'
        run: |
          eval "$($HOME/miniforge/bin/conda shell.bash hook)"
          conda run -n card-lab quarto render people/current.qmd --to html --no-execute
          conda run -n card-lab quarto render people/alumni.qmd --to html --no-execute
          conda run -n card-lab quarto render people/principal-investigator.qmd --to html
          conda run -n card-lab quarto render people/pi-publications-list.qmd --to html
          conda run -n card-lab quarto render research/bibliometrics.ipynb --to html
          conda run -n card-lab quarto render research/scientometrics.ipynb --to html

      - name: Commit updated cache file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add files/zotero-group-library.json files/paytonej-pre-uc.json
          git add people/current people/alumni people/principal-investigator.qmd people/pi-publications-list.qmd
          git add docs/people docs/research
          git add files/references_card-lab_cited.csv files/references_citing_card-lab.csv files/references_citing_pre-uc.csv

          if git diff --cached --quiet; then
            echo "No cache changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh Zotero cache and derived publication pages"
          git push
