on:
  workflow_dispatch:
  push:
    branches: main
  schedule:
    - cron: '0 13 * * 4' # Weekly on Thursday at 1pm UTC (eastern time: 9am during standard time, 8am during daylight saving time)

name: Quarto Publish

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARD_LAB_SKIP_PRIVATE_RENDER_PATHS: "1"

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install Miniforge
        run: |
          curl -L -o miniforge.sh https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh
          bash miniforge.sh -b -p "$HOME/miniforge"
          echo "$HOME/miniforge/bin" >> "$GITHUB_PATH"

      - name: Create card-lab environment
        run: |
          eval "$($HOME/miniforge/bin/conda shell.bash hook)"
          conda env create -f environment.yml
          conda run -n card-lab python -m ipykernel install --user --name card-lab --display-name card-lab
          echo "$HOME/miniforge/envs/card-lab/bin" >> "$GITHUB_PATH"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

      - name: Fetch previously published private-dependent pages
        run: |
          mkdir -p .ci-preserved-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
            git worktree add .ci-gh-pages-snapshot origin/gh-pages
            for item in people/demographics.html people/timeline.html people/timeline_files; do
              if [[ -e ".ci-gh-pages-snapshot/$item" ]]; then
                mkdir -p ".ci-preserved-pages/$(dirname "$item")"
                cp -r ".ci-gh-pages-snapshot/$item" ".ci-preserved-pages/$item"
                echo "[ci-render] Preserved previous output: $item"
              fi
            done
            git worktree remove --force .ci-gh-pages-snapshot
          else
            echo "[ci-render] gh-pages branch not found; nothing to preserve"
          fi

      - name: Hide private-dependent standard render documents
        run: |
          mkdir -p .ci-hidden-render-paths
          while IFS= read -r path; do
            if [[ -f "$path" ]]; then
              mkdir -p ".ci-hidden-render-paths/$(dirname "$path")"
              mv "$path" ".ci-hidden-render-paths/$path"
              echo "[ci-render] Hid private-dependent document: $path"
            fi
          done <<'EOF'
          _people-action.ipynb
          people/demographics.ipynb
          people/timeline.ipynb
          EOF

          # people/demographics.ipynb and people/timeline.ipynb are linked from
          # the site sidebar. If nothing exists at those paths, Quarto can't
          # resolve the sidebar link to an output path and leaves the raw
          # .ipynb href in the published site, which 404s for every visitor.
          # Leave a lightweight stub (same front matter, no code cells) behind
          # so Quarto can resolve the link; its rendered output gets
          # overwritten by the previously published page below.
          while IFS= read -r path; do
            if [[ -f ".ci-hidden-render-paths/$path" ]]; then
              python3 scripts/stub-private-notebook.py ".ci-hidden-render-paths/$path" "$path"
              echo "[ci-render] Wrote placeholder stub for: $path"
            fi
          done <<'EOF'
          people/demographics.ipynb
          people/timeline.ipynb
          EOF

      - name: Render site
        run: quarto render

      - name: Graft previously published content into freshly rendered pages
        run: |
          if [[ ! -d .ci-preserved-pages ]]; then
            exit 0
          fi

          # Copying the previously published page wholesale would freeze its
          # navbar/sidebar/CSS at whatever Quarto version and theme were
          # current the last time someone ran `quarto publish gh-pages`
          # locally, while every other page keeps pace with today's render —
          # that drift is what shows up as "this page doesn't match the rest
          # of the site". Instead, graft just the real content (main body +
          # page-local table of contents) from the previously published page
          # into the page Quarto just rendered from the stub, so the chrome
          # always matches the current site and only the private-data-driven
          # content stays pinned to the last real render.
          for page in people/demographics.html people/timeline.html; do
            preserved=".ci-preserved-pages/$page"
            fresh="docs/$page"
            if [[ ! -f "$preserved" ]]; then
              continue
            fi
            if [[ -f "$fresh" ]]; then
              python3 scripts/splice-preserved-content.py "$fresh" "$preserved" "$fresh"
              echo "[ci-render] Grafted previously published content into: $fresh"
            else
              mkdir -p "$(dirname "$fresh")"
              cp "$preserved" "$fresh"
              echo "[ci-render] Restored previously published page as-is (nothing to graft into): $fresh"
            fi
          done

          if [[ -d .ci-preserved-pages/people/timeline_files ]]; then
            cp -r .ci-preserved-pages/people/timeline_files docs/people/timeline_files
            echo "[ci-render] Restored supporting assets: people/timeline_files"
          fi

          rm -rf .ci-preserved-pages

      - name: Restore hidden standard render documents
        if: ${{ always() }}
        run: |
          if [[ ! -d .ci-hidden-render-paths ]]; then
            exit 0
          fi

          while IFS= read -r path; do
            src=".ci-hidden-render-paths/$path"
            if [[ -f "$src" ]]; then
              mkdir -p "$(dirname "$path")"
              mv "$src" "$path"
              echo "[ci-render] Restored private-dependent document: $path"
            fi
          done <<'EOF'
          _people-action.ipynb
          people/demographics.ipynb
          people/timeline.ipynb
          EOF

          rm -rf .ci-hidden-render-paths

      - name: Publish rendered site
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}